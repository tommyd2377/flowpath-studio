# This launch profile is for the new FlowPath Studio project only.
# Hosted tester-demo candidate: zero idle instances; browser-primary voice control.
# Authorized temporary shared-code demo; live voice testing is manual only.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpuAlwaysAllocated: false

# Use the standard Next server rather than depend on preview Next 16 adapters.
scripts:
  buildCommand: npm run build
  runCommand: npm run start:hosting

env:
  - variable: FLOWPATH_PUBLIC_ORIGIN
    value: https://flowpath.studio
    availability: [RUNTIME]
  # App Hosting preserves the public host in X-Forwarded-Host on this transport.
  - variable: FLOWPATH_TRUSTED_PROXY_HOST
    value: flowpath-studio-317729996674.us-east4.run.app
    availability: [RUNTIME]
  - variable: FLOWPATH_ACCOUNT_MODE
    value: firebase
    availability: [RUNTIME]
  - variable: FLOWPATH_FIREBASE_PROJECT_ID
    value: flowpath-studio
    availability: [RUNTIME]
  - variable: FLOWPATH_FIREBASE_AUTO_CONFIG
    value: "1"
    availability: [RUNTIME]
  - variable: FLOWPATH_FIRESTORE_EDITION
    value: standard
    availability: [RUNTIME]
  - variable: FLOWPATH_LIVE_ENABLED
    value: "1"
    availability: [RUNTIME]
  - variable: FLOWPATH_HOSTED_TESTER_DEMO
    value: "1"
    availability: [RUNTIME]
  - variable: FLOWPATH_TESTER_ALLOWANCE_PERIOD
    value: daily
    availability: [RUNTIME]
  # Owner-approved private Knowledge, $5/month estimated storage guard; customer charging stays off.
  - variable: FLOWPATH_KNOWLEDGE_ENABLED
    value: "1"
    availability: [RUNTIME]
  # Remove this override or set it to "0" to resume exact-version review.
  - variable: FLOWPATH_CREATION_SAFETY_PAUSED
    value: "1"
    availability: [RUNTIME]
  - variable: FLOWPATH_CREATION_SAFETY_ENABLED
    value: "1"
    availability: [RUNTIME]
  - variable: FLOWPATH_CREATION_POLICY_PRESET
    value: conservative-v3
    availability: [RUNTIME]
  - variable: FLOWPATH_PAID_TEST_ENABLED
    value: "0"
    availability: [RUNTIME]
  - variable: FLOWPATH_PUBLIC_DEMO_ENABLED
    value: "1"
    availability: [RUNTIME]
  # Application sign-in itself requires a redeemed invitation.
  - variable: FLOWPATH_VOICE_ACCESS
    value: signed-in
    availability: [RUNTIME]
  # Legacy-policy configuration is retained for cleanup/local compatibility.
  # Hosted tester admission uses its separate 180-second daily UID allowance;
  # these historical reservation totals do not impose a daily OpenAI guard.
  - variable: FLOWPATH_VOICE_OWNER_DAILY_SECONDS
    value: "900"
    availability: [RUNTIME]
  - variable: FLOWPATH_VOICE_GLOBAL_DAILY_SECONDS
    value: "3600"
    availability: [RUNTIME]
  - variable: FLOWPATH_VOICE_GLOBAL_CONCURRENCY
    value: "2"
    availability: [RUNTIME]
  - variable: FLOWPATH_VOICE_TASKS_LOCATION
    value: us-east4
    availability: [RUNTIME]
  - variable: FLOWPATH_VOICE_TASKS_QUEUE
    value: flowpath-voice-expiry
    availability: [RUNTIME]
  - variable: FLOWPATH_VOICE_TASKS_SERVICE_ACCOUNT
    value: flowpath-voice-expiry@flowpath-studio.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability: [RUNTIME]
